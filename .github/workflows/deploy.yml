name: 🚀 Auto Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Check Secrets Configuration
        run: |
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ CHƯA CÀI ĐẶT MẬT KHẨU FTP!"
            echo "👉 Hãy vào: Settings -> Secrets and variables -> Actions -> Thêm Secret 'FTP_PASSWORD'"
            exit 1
          fi
          echo "✓ Đã tìm thấy FTP Secrets!"

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, zip, curl
          coverage: none
          tools: composer:v2

      - name: 📦 Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install PHP Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🔨 Install NPM Dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: 📂 Deploy Changes via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftpupload.net' }}
          username: ${{ secrets.FTP_USERNAME || 'if0_42986888' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          protocol: ftp
          port: 21
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            phpunit.xml
            README.md
            docs/**
            scripts/**
            .env*
            .phpunit.result.cache
            diag.php
            test.php
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**

      - name: 🚀 Auto-Extract Cloudinary Vendor Package on Server
        run: |
          echo "Waiting 3 seconds before triggering extractor..."
          sleep 3
          curl -s -L https://lunarasilver.infinityfreeapp.com/update_vendor.php || true

